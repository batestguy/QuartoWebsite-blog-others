project:
  type: website
  output-dir: _site
  # Only .qmd files are site content. Without this, Quarto also renders every
  # .md in the project — CLAUDE.md, CATEGORIES.md and ENVIRONMENTS.md would be
  # published as public pages, and ENVIRONMENTS.md is a map of this machine.
  render:
    - "**/*.qmd"

# The single most important longevity setting in this file.
# Once a post is rendered and its _freeze artifacts are committed, Quarto
# replays stored results instead of re-executing until the .qmd itself changes.
# A package upgrade therefore cannot retroactively alter a published post.
execute:
  freeze: auto

website:
  title: "Thoughts by Your Hommie"
  site-url: "https://batestguy.github.io/QuartoWebsite-blog-others/"
  description: "Statistical and machine learning cases, simulations that verify beliefs before the data arrives, and stats textbooks rewritten simpler."
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: stats.qmd
        text: Stats
      - href: simulations.qmd
        text: Simulations
      - href: books.qmd
        text: Books
      # The content streams stay contiguous, before "All posts".
      #
      # "In life", not the page's own title "Stats in our lives". That is a
      # measurement, not taste.
      #
      # .navbar-nav is a nowrap flex row, so an over-full bar does not wrap to a
      # second ROW — it shrinks the items until a multi-word LABEL breaks in
      # half, taking the bar from 44px to 71px. Measured on the built page:
      #
      #   "Stats in our lives"  one line to 1280px, broken by 1180px
      #   "In life"             one line to 1180px, broken by 1100px
      #
      # Both clear 1440px with room (254px of slack), so this only matters on a
      # windowed laptop — but the bar stays expanded all the way down to
      # Bootstrap's lg breakpoint at 992px, so that band is real. "In life" buys
      # roughly 100px of headroom over the full phrase, and the full phrase
      # survives as the page title on life.qmd.
      #
      # Note the bar is ALREADY over-full before this entry existed: "All posts"
      # breaks at 1024px with or without it. Not fixed here — that is a
      # site-wide navbar decision, not part of adding a stream.
      - href: life.qmd
        text: In life
      - href: blog.qmd
        text: All posts
      - href: projects.qmd
        text: Projects
      - href: about.qmd
        text: About
    right:
      # A contact route on every page, not only on the one page a reader may
      # never open. The address is already published on about.qmd, so this
      # adds reach rather than exposure.
      - icon: envelope
        href: "mailto:batesthommie@gmail.com"
        aria-label: Email
      - icon: rss
        href: blog.xml
        aria-label: RSS feed
      - icon: github
        href: https://github.com/batestguy/QuartoWebsite-blog-others
        aria-label: Source on GitHub
  page-footer:
    left: "© 2026 Batesthommie"
    center: "Built with [Quarto](https://quarto.org). Results are frozen at publication."
    right:
      - icon: envelope
        href: "mailto:batesthommie@gmail.com"
        aria-label: Email
      - icon: rss
        href: blog.xml
      - icon: github
        href: https://github.com/batestguy/QuartoWebsite-blog-others

format:
  html:
    theme:
      light: [cosmo, theme/light.scss]
      dark: [darkly, theme/dark.scss]
    toc: true
    code-fold: show
    code-tools: true
    code-copy: true
    code-link: true
    anchor-sections: true
    google-scholar: false
    # Both scripts are presentation-only and fail silent by design — if either
    # does not run the page is correct, just plainer. See each file's comment.
    #   category-accents  decodes Quarto's base64 category slugs onto
    #                     data-category-name so the stylesheet can select on
    #                     readable slugs.
    #   post-meta         adds the executed language and frozen state to a
    #                     post's metadata rule, read from the rendered DOM.
    include-after-body:
      - theme/category-accents.html
      - theme/post-meta.html
